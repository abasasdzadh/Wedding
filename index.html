<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کارت عروسی زهرا و علیرضا</title>

  <!-- فونت‌های گوگل برای خط نستعلیق و خطوط خوشنویسی انگلیسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;600&family=Great+Vibes&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* حذف کامل هرگونه اسکرول در تمام دیوایس‌ها */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2b2b30 0%, #111113 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Nastaliq Urdu', 'IranNastaliq', Tahoma, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* کادر کلی کارت متناسب با ارتفاع صفحه (بدون اسکرول) */
    .card-scene {
      position: relative;
      height: 94vh;
      max-height: 720px;
      aspect-ratio: 1 / 1.58;
      perspective: 1400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    /* ===================================================
       ۱. کارت اصلی چاپی (دقیقاً مشابه عکس اول)
       =================================================== */
    .wedding-card {
      position: absolute;
      inset: 0;
      background: #ffffff;
      border: 1.5px solid #1a1a1a;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.2% 3.5% 3% 3.5%;
      z-index: 1;
    }

    /* سربرگ لاتین */
    .header-section {
      text-align: center;
      direction: ltr;
      width: 100%;
      margin-bottom: 2px;
    }

    .welcome-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(18px, 3vh, 25px);
      color: #111;
      line-height: 1;
    }

    .party-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(7px, 1.1vh, 9.5px);
      letter-spacing: 2.5px;
      color: #222;
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* قاب عکس با حاشیه مشکی و انحنای هلالی در پایین */
    .photo-frame {
      width: 88%;
      height: 44%;
      border: 1px solid #1a1a1a;
      border-radius: 0 0 50% 50% / 0 0 36% 36%;
      overflow: hidden;
      background-color: #f7f7f7;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* بخش متن‌های کارت */
    .text-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      flex: 1;
      padding-top: 4px;
    }

    .poem {
      font-size: clamp(14px, 2.3vh, 19px);
      color: #111;
      line-height: 1.8;
      text-align: center;
      margin: 0;
    }

    /* بخش نام‌ها و نام خانوادگی */
    .names-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .names-row {
      direction: ltr;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: -2px 0;
      width: 100%;
    }

    .name-english {
      font-family: 'Alex Brush', cursive;
      font-size: clamp(30px, 4.6vh, 42px);
      color: #111;
      line-height: 1;
    }

    .heart-icon {
      font-size: clamp(16px, 2.5vh, 22px);
      color: #111;
      transform: translateY(-2px);
    }

    /* وسط‌چین کردن کامل و دقیق نام خانوادگی */
    .family-subtitle {
      direction: ltr;
      font-family: 'Cinzel', serif;
      font-size: clamp(9px, 1.4vh, 12px);
      letter-spacing: 2.5px;
      text-indent: 2.5px; /* جبران فاصله حرف آخر برای تراز دقیق وسط */
      color: #222;
      font-weight: 600;
      text-align: center;
      width: 100%;
      display: block;
      margin-top: 2px;
    }

    /* بخش تاریخ سه ستونه (راست: چهارشنبه | وسط: ۲۲ مهرماه | چپ: ۱۴۰۵) */
    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 82%;
      margin: 2px 0;
      direction: rtl;
    }

    .date-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #111;
    }

    .weekday-txt {
      font-size: clamp(15px, 2.3vh, 20px);
    }

    .day-num {
      font-size: clamp(19px, 3vh, 26px);
      font-weight: bold;
      line-height: 1;
    }

    .month-txt {
      font-size: clamp(12px, 1.8vh, 15px);
      margin-top: 1px;
    }

    .year-txt {
      font-size: clamp(16px, 2.5vh, 22px);
      font-weight: bold;
    }

    .vertical-sep {
      width: 1px;
      height: clamp(30px, 4.5vh, 40px);
      background: #333;
      margin: 0 8px;
    }

    .time-txt {
      font-size: clamp(14px, 2.1vh, 18px);
      color: #111;
      line-height: 1.4;
    }

    .address-txt {
      font-size: clamp(11.5px, 1.7vh, 14.5px);
      line-height: 1.65;
      color: #111;
      text-align: center;
      width: 96%;
    }

    /* ===================================================
       ۲. پاکت کالک، مرواریدها و موم
       =================================================== */
    .envelope-flap {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.4%;
      z-index: 10;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(6px) saturate(110%);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
      transition: transform 1.25s cubic-bezier(0.35, 1.05, 0.35, 1), opacity 0.8s ease;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .flap-left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid rgba(0, 0, 0, 0.12);
    }

    .flap-right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid rgba(0, 0, 0, 0.12);
    }

    /* مرواریدهای روی پاکت کالک */
    .pearl {
      position: absolute;
      width: clamp(8px, 1.3vh, 11px);
      height: clamp(8px, 1.3vh, 11px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f4f4f4 40%, #cccccc 80%, #999999 100%);
      box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .p-top-right { top: 12px; right: 12px; }
    .p-top-center { top: 12px; left: 50%; transform: translateX(-50%); }
    .p-top-left { top: 12px; left: 12px; }

    .p-bottom-right { bottom: 12px; right: 12px; }
    .p-bottom-center { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .p-bottom-left { bottom: 12px; left: 12px; }

    .p-flap-mid-right { top: 38%; right: 28%; }
    .p-flap-mid-left { top: 62%; left: 28%; }

    /* مهر و موم سفید شیری با طرح شاخه زیتون */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(62px, 9.5vh, 78px);
      height: clamp(62px, 9.5vh, 78px);
      transform: translate(-50%, -50%);
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 51% 49% 48% 52% / 52% 48% 52% 48%;
      background: radial-gradient(circle at 38% 35%, #ffffff 0%, #faf8f5 42%, #e5e0d7 82%, #ccc5ba 100%);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28),
                  inset 0 2px 4px rgba(255, 255, 255, 0.9),
                  inset 0 -3px 5px rgba(0, 0, 0, 0.15);
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .wax-seal:hover {
      transform: translate(-50%, -50%) scale(1.04);
    }

    /* حاشیه دایره‌ای فرورفته مهر */
    .seal-inner {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      border: 1.5px solid rgba(175, 170, 158, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(255,255,255,0.7) 0%, rgba(225,220,210,0.3) 100%);
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.12), 
                  0.5px 0.5px 1px rgba(255, 255, 255, 0.9);
    }

    /* وکتور شاخه گیاهی با برجستگی سه‌بعدی روی موم */
    .seal-emboss-svg {
      width: 65%;
      height: 65%;
      fill: none;
      stroke: #a8a294;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(1px 1px 0px rgba(255, 255, 255, 0.95))
              drop-shadow(-0.8px -0.8px 0px rgba(120, 115, 105, 0.5));
    }

    /* ===================================================
       ۳. انیمیشن باز شدن کارت و پاکت
       =================================================== */
    .card-scene.opened .flap-left {
      transform: rotateY(-115deg);
      opacity: 0;
    }

    .card-scene.opened .flap-right {
      transform: rotateY(115deg);
      opacity: 0;
    }

    .card-scene.opened .wax-seal {
      transform: translate(-50%, -50%) scale(0) rotate(15deg);
      opacity: 0;
      pointer-events: none;
    }

    /* حذف کامل مرواریدها به محض باز شدن پاکت */
    .card-scene.opened .pearl {
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card-scene" id="cardScene">

    <!-- کارت عروسی اصلی -->
    <div class="wedding-card">
      
      <div class="header-section">
        <div class="welcome-text">welcome to</div>
        <div class="party-text">OUR WEDDING PARTY</div>
      </div>

      <!-- قاب عکس با انحنای هلالی -->
      <div class="photo-frame">
        <!-- عکس در گیت‌هاب باید کنار همین فایل با نام photo.jpg باشد -->
        <img src="./photo.PNG" alt="عروس و داماد">
      </div>

      <div class="text-content">
        
        <div class="poem">از یک قلب کودکی، تا یک عمر عاشقی</div>

        <!-- نام‌ها و نام خانوادگی کاملاً وسط‌چین -->
        <div class="names-block">
          <div class="names-row">
            <span class="name-english">Zahra</span>
            <span class="heart-icon">&#9825;</span>
            <span class="name-english">Alireza</span>
          </div>
          <div class="family-subtitle">ADEL-RUSTAMZADEH</div>
        </div>

        <!-- تاریخ: راست (چهارشنبه) - وسط (۲۲ مهرماه) - چپ (۱۴۰۵) -->
        <div class="date-row">
          <div class="date-item">
            <span class="weekday-txt">چهارشنبه</span>
          </div>

          <div class="vertical-sep"></div>

          <div class="date-item">
            <span class="day-num">۲۲</span>
            <span class="month-txt">مهرماه</span>
          </div>

          <div class="vertical-sep"></div>

          <div class="date-item">
            <span class="year-txt">۱۴۰۵</span>
          </div>
        </div>

        <div class="time-txt">ساعت ۱۹ الی ۲۲</div>

        <div class="address-txt">
          پاکدشت - میدان پارچین - بلوار شهدای رحیمی - جنب بیستک - تالار سام
        </div>

      </div>

    </div>

    <!-- لنگه چپ پاکت کالک مات -->
    <div class="envelope-flap flap-left"></div>

    <!-- لنگه راست پاکت کالک مات -->
    <div class="envelope-flap flap-right"></div>

    <!-- مرواریدهای روی پاکت کالک -->
    <div class="pearl p-top-right"></div>
    <div class="pearl p-top-center"></div>
    <div class="pearl p-top-left"></div>

    <div class="pearl p-bottom-right"></div>
    <div class="pearl p-bottom-center"></div>
    <div class="pearl p-bottom-left"></div>

    <div class="pearl p-flap-mid-right"></div>
    <div class="pearl p-flap-mid-left"></div>

    <!-- مهر و موم سفید با طرح شاخه زیتون -->
    <div class="wax-seal" id="waxSeal">
      <div class="seal-inner">
        <svg class="seal-emboss-svg" viewBox="0 0 24 24">
          <path d="M6 19 C9 15 13 11 18 5" />
          <path d="M11 13 C9.5 11.5 9 9.5 10.5 8.5 C12 7.5 13.5 9.5 13 11 Z" fill="#b3ad9f" />
          <path d="M14 10 C13.5 8 14 6 15.5 5.5 C17 5 17.5 7 16.5 8.5 Z" fill="#b3ad9f" />
          <path d="M8 16 C6.5 15 6 13 7.5 12 C9 11 10 13 9.5 14.5 Z" fill="#b3ad9f" />
        </svg>
      </div>
    </div>

  </div>

  <script>
    const cardScene = document.getElementById('cardScene');
    const waxSeal = document.getElementById('waxSeal');

    // باز شدن پاکت و ناپدید شدن مرواریدها با لمس موم
    waxSeal.addEventListener('click', () => {
      cardScene.classList.add('opened');
    });
  </script>

</body>
</html>
