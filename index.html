<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کارت عروسی زهرا و علیرضا</title>

  <!-- فونت‌های گوگل برای خط نستعلیق و خطوط خوشنویسی انگلیسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;600&family=Great+Vibes&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* حذف کامل هرگونه اسکرول در تمام دیوایس‌ها */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2b2b30 0%, #111113 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Nastaliq Urdu', 'IranNastaliq', Tahoma, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* کادر کلی کارت متناسب با ارتفاع صفحه (بدون اسکرول) */
    .card-scene {
      position: relative;
      height: 94vh;
      max-height: 720px;
      aspect-ratio: 1 / 1.58;
      perspective: 1400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    /* ===================================================
       ۱. کارت اصلی چاپی (دقیقاً مشابه عکس اول)
       =================================================== */
    .wedding-card {
      position: absolute;
      inset: 0;
      background: #ffffff;
      border: 1.5px solid #1a1a1a;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.2% 3.5% 3% 3.5%;
      z-index: 1;
    }

    /* سربرگ لاتین */
    .header-section {
      text-align: center;
      direction: ltr;
      width: 100%;
      margin-bottom: 2px;
    }

    .welcome-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(18px, 3vh, 25px);
      color: #111;
      line-height: 1;
    }

    .party-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(7px, 1.1vh, 9.5px);
      letter-spacing: 2.5px;
      color: #222;
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* قاب عکس با حاشیه مشکی و انحنای هلالی در پایین */
    .photo-frame {
      width: 88%;
      height: 44%;
      border: 1px solid #1a1a1a;
      border-radius: 0 0 50% 50% / 0 0 36% 36%;
      overflow: hidden;
      background-color: #f7f7f7;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* بخش متن‌های کارت */
    .text-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      flex: 1;
      padding-top: 4px;
    }

    .poem {
      font-size: clamp(14px, 2.3vh, 19px);
      color: #111;
      line-height: 1.8;
      text-align: center;
      margin: 0;
    }

    /* بخش نام‌ها و نام خانوادگی */
    .names-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .names-row {
      direction: ltr;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: -2px 0;
      width: 100%;
    }

    .name-english {
      font-family: 'Alex Brush', cursive;
      font-size: clamp(30px, 4.6vh, 42px);
      color: #111;
      line-height: 1;
    }

    /* وکتور قلب خطی ظریف (دقیقاً مثل کارت اصلی بدون به‌هم‌ریختگی فونت) */
    .heart-svg {
      width: clamp(17px, 2.7vh, 23px);
      height: clamp(17px, 2.7vh, 23px);
      stroke: #111;
      stroke-width: 1.6;
      fill: none;
      transform: translateY(-1px);
    }

    .family-subtitle {
      direction: ltr;
      font-family: 'Cinzel', serif;
      font-size: clamp(9px, 1.4vh, 12px);
      letter-spacing: 2.5px;
      text-indent: 2.5px;
      color: #222;
      font-weight: 600;
      text-align: center;
      width: 100%;
      display: block;
      margin-top: 2px;
    }

    /* بخش تاریخ سه ستونه (راست: چهارشنبه | وسط: ۲۲ مهرماه | چپ: ۱۴۰۵) */
    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 82%;
      margin: 2px 0;
      direction: rtl;
    }

    .date-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #111;
    }

    .weekday-txt {
      font-size: clamp(15px, 2.3vh, 20px);
    }

    .day-num {
      font-size: clamp(19px, 3vh, 26px);
      font-weight: bold;
      line-height: 1;
    }

    .month-txt {
      font-size: clamp(12px, 1.8vh, 15px);
      margin-top: 1px;
    }

    .year-txt {
      font-size: clamp(16px, 2.5vh, 22px);
      font-weight: bold;
    }

    .vertical-sep {
      width: 1px;
      height: clamp(30px, 4.5vh, 40px);
      background: #333;
      margin: 0 8px;
    }

    .time-txt {
      font-size: clamp(14px, 2.1vh, 18px);
      color: #111;
      line-height: 1.4;
    }

    .address-txt {
      font-size: clamp(11.5px, 1.7vh, 14.5px);
      line-height: 1.65;
      color: #111;
      text-align: center;
      width: 96%;
    }

    /* ===================================================
       ۲. پاکت کالک مات دقیقاً طبق عکس واقعی
       =================================================== */
    .envelope-flap {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.3%;
      z-index: 10;
      background: rgba(255, 255, 255, 0.73);
      backdrop-filter: blur(7px) saturate(110%);
      -webkit-backdrop-filter: blur(7px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
      transition: transform 1.25s cubic-bezier(0.35, 1.05, 0.35, 1), opacity 0.8s ease;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .flap-left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid rgba(0, 0, 0, 0.08);
    }

    .flap-right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* ===================================================
       ۳. مرواریدها (دقیقاً ۱۰ عدد در موقعیت‌های واقعی)
       =================================================== */
    .pearl {
      position: absolute;
      width: clamp(8.5px, 1.35vh, 11.5px);
      height: clamp(8.5px, 1.35vh, 11.5px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f6f6f6 38%, #d2d2d2 75%, #9e9e9e 100%);
      box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.32);
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* ۳ مروارید لبه راست */
    .p-right-top { top: 16px; right: 14px; }
    .p-right-mid { top: 50%; right: 14px; transform: translateY(-50%); }
    .p-right-bottom { bottom: 16px; right: 14px; }

    /* ۳ مروارید لبه چپ */
    .p-left-top { top: 16px; left: 14px; }
    .p-left-mid { top: 50%; left: 14px; transform: translateY(-50%); }
    .p-left-bottom { bottom: 16px; left: 14px; }

    /* ۲ مروارید روی عکس بالا */
    .p-photo-left { top: 38%; left: 30%; }
    .p-photo-right { top: 38%; right: 30%; }

    /* ۲ مروارید روی متن‌های پایین */
    .p-text-left { top: 64%; left: 30%; }
    .p-text-right { top: 64%; right: 30%; }

    /* ===================================================
       ۴. موم مهری سفید، بدون طرح با لبه‌های نامتقارن
       =================================================== */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(66px, 10.5vh, 84px);
      height: clamp(66px, 10.5vh, 84px);
      transform: translate(-50%, -50%);
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 43% 57% 49% 51% / 54% 45% 55% 46%;
      background: radial-gradient(circle at 40% 35%, #ffffff 0%, #fbf9f6 40%, #e6e1d7 78%, #ccc5b8 100%);
      box-shadow: 
        0 8px 22px rgba(0, 0, 0, 0.32),
        inset 2px 3px 6px rgba(255, 255, 255, 0.95),
        inset -3px -4px 7px rgba(0, 0, 0, 0.16);
      transition: transform 0.4s ease, opacity 0.5s ease;
    }

    .wax-seal:hover {
      transform: translate(-50%, -50%) scale(1.035);
    }

    .seal-pressed-bed {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #faf8f5 0%, #ece8df 65%, #ddd7cc 100%);
      box-shadow: 
        inset 2px 3px 6px rgba(0, 0, 0, 0.2),
        inset -1px -1px 3px rgba(255, 255, 255, 0.8),
        0 1px 2px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(185, 178, 166, 0.5);
    }

    /* ===================================================
       ۵. انیمیشن باز شدن کارت
       =================================================== */
    .card-scene.opened .flap-left {
      transform: rotateY(-115deg);
      opacity: 0;
    }

    .card-scene.opened .flap-right {
      transform: rotateY(115deg);
      opacity: 0;
    }

    .card-scene.opened .wax-seal {
      transform: translate(-50%, -50%) scale(0) rotate(15deg);
      opacity: 0;
      pointer-events: none;
    }

    /* محو شدن مرواریدها */
    .card-scene.opened .pearl {
      opacity: 0;
      transform: scale(0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- فایل صوتی موزیک در گیت‌هاب -->
  <audio id="weddingMusic" src="./music.mp3" preload="auto"></audio>

  <div class="card-scene" id="cardScene">

    <!-- کارت عروسی اصلی -->
    <div class="wedding-card">
      
      <div class="header-section">
        <div class="welcome-text">welcome to</div>
        <div class="party-text">OUR WEDDING PARTY</div>
      </div>

      <!-- قاب عکس (نام فایل دقیقاً طبق photo.PNG در گیت‌هاب شما) -->
      <div class="photo-frame">
        <img src="./photo.PNG" alt="عروس و داماد">
      </div>

      <div class="text-content">
        
        <div class="poem">از یک قلب کودکی، تا یک عمر عاشقی</div>

        <!-- نام‌ها با قلب خطی دقیق -->
        <div class="names-block">
          <div class="names-row">
            <span class="name-english">Zahra</span>
            
            <!-- وکتور قلب خطی دست‌ساز -->
            <svg class="heart-svg" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>

            <span class="name-english">Alireza</span>
          </div>
          <div class="family-subtitle">ADEL-RUSTAMZADEH</div>
        </div>

        <!-- تاریخ: راست (چهارشنبه) - وسط (۲۲ مهرماه) - چپ (۱۴۰۵) -->
        <div class="date-row">
          <div class="date-item">
            <span class="weekday-txt">چهارشنبه</span>
          </div>

          <div class="vertical-sep"></div>

          <div class="date-item">
            <span class="day-num">۲۲</span>
            <span class="month-txt">مهرماه</span>
          </div>

          <div class="vertical-sep"></div>

          <div class="date-item">
            <span class="year-txt">۱۴۰۵</span>
          </div>
        </div>

        <div class="time-txt">ساعت ۱۹ الی ۲۲</div>

        <div class="address-txt">
          پاکدشت - میدان پارچین - بلوار شهدای رحیمی - جنب بیستک - تالار سام
        </div>

      </div>

    </div>

    <!-- لنگه چپ پاکت کالک مات -->
    <div class="envelope-flap flap-left"></div>

    <!-- لنگه راست پاکت کالک مات -->
    <div class="envelope-flap flap-right"></div>

    <!-- ۱۰ مروارید دقیقاً طبق پاکت واقعی -->
    <div class="pearl p-right-top"></div>
    <div class="pearl p-right-mid"></div>
    <div class="pearl p-right-bottom"></div>

    <div class="pearl p-left-top"></div>
    <div class="pearl p-left-mid"></div>
    <div class="pearl p-left-bottom"></div>

    <div class="pearl p-photo-left"></div>
    <div class="pearl p-photo-right"></div>

    <div class="pearl p-text-left"></div>
    <div class="pearl p-text-right"></div>

    <!-- موم مهری سفید، بدون طرح و با لبه‌های طبیعی -->
    <div class="wax-seal" id="waxSeal">
      <div class="seal-pressed-bed"></div>
    </div>

  </div>

  <script>
    const cardScene = document.getElementById('cardScene');
    const waxSeal = document.getElementById('waxSeal');
    const music = document.getElementById('weddingMusic');

    // با لمس موم: پاکت باز می‌شود و آهنگ شروع به پخش می‌کند
    waxSeal.addEventListener('click', () => {
      cardScene.classList.add('opened');
      
      // پخش اتوماتیک موزیک با لمس کاربر
      if (music) {
        music.play().catch(error => {
          console.log("پخش خودکار انجام نشد:", error);
        });
      }
    });
  </script>

</body>
</html>
